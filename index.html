<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EF" />
    
    <!-- iOS meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    
    <title>OpenBible</title>
    
    <!-- Fonts: Inter (sans) and Crimson Pro (serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      #global-preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100dvh;
        background-color: #FAF6EF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
        color: #2B2620;
        font-family: 'Inter', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #global-preloader {
          background-color: #1A1917;
          color: #EDE6D9;
        }
      }
      #global-preloader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(184, 145, 47, 0.2);
        border-radius: 50%;
        border-top-color: #B8912F;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .preloader-text {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: #B8912F;
      }
    </style>
  </head>
  <body style="overflow: hidden; margin: 0;">
    <div id="global-preloader">
      <div class="preloader-spinner"></div>
      <div class="preloader-text">Avvio in corso...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
